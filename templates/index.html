<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Information Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index_styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Search Cerner Order Sentences</h1>
        <form action="/search" method="post">
            <label for="drug_name">Drug Name:</label>
            <input type="text" id="drug_name" name="drug_name" required>
            <input type="submit" value="Search">
        </form>
    </div>

    <div class="container" style="margin-top: 30px;">
        <h2>Full Drug Information Search (openFDA, SPLs, Gemini)</h2>
        <form id="fullDrugSearchStep1Form">
            <label for="full_drug_name_step1">Drug Name:</label>
            <input type="text" id="full_drug_name_step1" name="drug_name" required>
            <input type="button" id="getSplSuggestionsBtn" value="Get SPL Suggestions & Select Forms">
        </form>

        <div id="splSelectionArea" style="margin-top: 20px; display: none;">
            <h3>Select Dosage Forms for Detailed Analysis:</h3>
            <form id="fullDrugSearchStep2Form" action="/full_drug_search" method="post">
                <input type="hidden" id="full_drug_name_step2" name="drug_name">
                <ul id="splCheckboxes" class="spl-card-list"></ul>
                <input type="submit" id="processSelectedSplsBtn" value="Get Full Dosing Info for Selected SPLs" style="margin-top: 15px;">
            </form>
        </div>
        <div id="splLoadingIndicator" style="display: none; margin-top: 10px; color: #31708f;">Fetching SPLs and suggestions...</div>
        <div id="splErrorArea" style="display: none; margin-top: 10px; color: red;"></div>
    </div>

    <div id="loading-indicator">Processing your request, please wait... This may take a moment.</div>

    <script src="{{ url_for('static', filename='js/index_scripts.js') }}"></script>
</body>
</html>
